<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@300;400;600;700&display=swap"
  rel="stylesheet">

<div style="font-family: 'Noto Sans Arabic', sans-serif;">
  <div class="relative min-h-[calc(100vh-64px)] flex justify-center
  items-center">
    <div class="absolute inset-0 bg-cover bg-center blur-sm opacity-50" style="background-image: url('/map-bg.png');">
    </div>
    <div class="absolute inset-0 bg-white/30"></div>
    <div class="relative sm:max-w-sm w-full z-10">
      <div class="relative sm:max-w-sm w-full rounded-3xl px-6 py-6
                          bg-white/90 shadow-xl backdrop-blur-md mx-auto mt-10">

        <!-- Logo + Título -->
        <div class="relative mt-3 h-14 flex items-center justify-center">
          <div class="absolute left-0">
            <img src="/logo_inunda_go.png" class="w-16 h-16" alt="logo" />
          </div>
          <label class="block text-lg text-gray-700 font-semibold text-center">
            Mi perfil
          </label>
        </div>

        <!-- LOADING -->
        <div *ngIf="loading" class="mt-10 flex items-center justify-center gap-3 text-gray-700">
          <span class="h-5 w-5 rounded-full border-2 border-gray-300 border-t-gray-700 animate-spin"></span>
          <span>Cargando perfil...</span>
        </div>

        <!-- ERROR -->
        <div *ngIf="error" class="mt-4 rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-red-800">
          {{ error }}
        </div>

        <!-- SUCCESS -->
        <div *ngIf="success" class="mt-4 rounded-xl border border-emerald-200 bg-emerald-50 px-4 py-3 text-emerald-800">
          {{ success }}
        </div>

        <!-- CONTENIDO -->
        <div *ngIf="user as u">

          <!-- VISTA NORMAL -->
          <div *ngIf="!editMode" class="mt-10">

            <div>
              <label class="block text-sm text-gray-500">Nombre</label>
              <p class="mt-1 w-full bg-gray-100 h-11 rounded-xl shadow-lg
                                        px-4 flex items-center text-gray-900 font-medium leading-[2.75rem]">
                {{ u.nombre }}
              </p>
            </div>

            <div class="mt-7">
              <label class="block text-sm text-gray-500">Apellidos</label>
              <p class="mt-1 w-full bg-gray-100 h-11 rounded-xl shadow-lg
                                        px-4 flex items-center text-gray-900 font-medium leading-[2.75rem]">
                {{ u.apellidos }}
              </p>
            </div>

            <div class="mt-7">
              <label class="block text-sm text-gray-500">Email</label>
              <p class="mt-1 w-full bg-gray-100 h-11 rounded-xl shadow-lg
                                        px-4 flex items-center text-gray-900 font-medium leading-[2.75rem]">
                {{ u.email }}
              </p>
            </div>

            <div class="mt-7">
              <label class="block text-sm text-gray-500">Rol</label>
              <p class="mt-1 w-full bg-gray-100 h-11 rounded-xl shadow-lg
                                        px-4 flex items-center text-gray-700 font-medium leading-[2.75rem]">
                {{ roleLabel(u.rolDTO?.nombre) }}
              </p>
            </div>

            <div class="mt-7">
              <button class="bg-blue-600 w-full py-3 rounded-xl text-white shadow-xl
                                         hover:shadow-inner focus:outline-none transition duration-500
                                         ease-in-out transform hover:-translate-x hover:scale-105"
                (click)="startEdit()">
                Editar perfil
              </button>
            </div>

            <div class="mt-4">
              <button class="bg-red-600 w-full py-3 rounded-xl text-white shadow-xl
                                         hover:shadow-inner focus:outline-none transition duration-500
                                         ease-in-out transform hover:-translate-x hover:scale-105" (click)="logout()">
                Cerrar sesión
              </button>
            </div>
          </div>

          <!-- MODO EDICIÓN -->
          <form *ngIf="editMode" [formGroup]="form" class="mt-10">

            <div>
              <input type="text" placeholder=" Nombre" class="mt-1 block w-full border-none bg-gray-100 h-11 rounded-xl
                                         shadow-lg hover:bg-gray-200 focus:bg-gray-200 focus:ring-0"
                formControlName="nombre">
            </div>

            <div class="mt-7">
              <input type="text" placeholder=" Apellidos" class="mt-1 block w-full border-none bg-gray-100 h-11 rounded-xl
                                         shadow-lg hover:bg-gray-200 focus:bg-gray-200 focus:ring-0"
                formControlName="apellidos">
            </div>



            <!-- BOTONES -->
            <div class="mt-7">
              <button type="button" class="bg-blue-600 w-full py-3 rounded-xl text-white shadow-xl
                                         hover:shadow-inner focus:outline-none transition duration-500
                                         ease-in-out transform hover:-translate-x hover:scale-105
                                         disabled:opacity-60 disabled:cursor-not-allowed" [disabled]="saving"
                (click)="save()">
                <span *ngIf="saving" class="inline-block align-middle mr-2 h-4 w-4 rounded-full
                                             border-2 border-white/40 border-t-white animate-spin"></span>
                Guardar cambios
              </button>
            </div>

            <div class="mt-4">
              <button type="button" class="bg-gray-600 w-full py-3 rounded-xl text-white shadow-xl
                                         hover:shadow-inner focus:outline-none transition duration-500
                                         ease-in-out transform hover:-translate-x hover:scale-105"
                (click)="cancelEdit()">
                Cancelar
              </button>
            </div>

          </form>

        </div>

      </div>
    </div>

  </div>
</div>
