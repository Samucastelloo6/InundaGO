<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@300;400;600;700&display=swap"
  rel="stylesheet">

<div style="font-family: 'Noto Sans Arabic', sans-serif;">
  <div class="relative min-h-screen flex justify-center items-center bg-cover bg-center"
    style="background-image: url('https://images.unsplash.com/photo-1493238792000-8113da705763?q=80&w=1920');">
    <!-- Overlay -->
    <div class="absolute inset-0 bg-black/40 backdrop-blur-sm"></div>

    <div class="relative w-full max-w-sm z-10 flex justify-center items-center">
      <div class="relative w-full min-h-[85vh] rounded-3xl px-6 py-10 bg-white/90 shadow-xl backdrop-blur-md flex flex-col">
        @if (isLoading) {
          <app-loading
            logo = "/icons/icon-48x48.png"
            message = "Cargando..."
            [darkBackground]="false"/>
        }

        <!-- Logo + Título -->
        <div class="flex flex-col items-center select-none mb-6 relative">
          <div class="absolute left-0">
            <img src="/logo_inunda_go.png" class="w-16 h-16" alt="logo" />
          </div>

          <h1
            class="text-4xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-blue-600 to-cyan-500 drop-shadow-md tracking-wide">
            InundaGo
          </h1>
        </div>

        <label class="block mt-5 text-sm text-gray-700 text-center font-semibold">
          Iniciar sesión
        </label>

        <form [formGroup]="form" (ngSubmit)="onSubmit()" class="mt-10">

          <div>
            <input type="text" formControlName="email" placeholder=" Usuario" class="mt-1 block w-full border-none bg-gray-100 h-11 rounded-xl shadow-lg
                     hover:bg-gray-200 focus:bg-gray-200 focus:ring-2 focus:ring-black/10 outline-none transition" />
          </div>

          <div class="mt-7">
            <input type="password" formControlName="password" placeholder=" Contraseña" class="mt-1 block w-full border-none bg-gray-100 h-11 rounded-xl shadow-lg
                     hover:bg-gray-200 focus:bg-gray-200 focus:ring-2 focus:ring-black/10 outline-none transition" />
          </div>

          <!-- ERROR (antes alert alert-error) -->
          <div *ngIf="errorMessage"
            class="mt-6 rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-red-800 text-sm shadow-sm">
            {{ errorMessage }}
          </div>

          <div class="mt-7">
            <button type="submit" class="w-full py-3 rounded-xl text-white font-semibold bg-blue-600 shadow-xl
                     hover:bg-blue-700 hover:shadow-inner focus:outline-none focus:ring-2 focus:ring-blue-200
                     transition duration-500 ease-in-out transform hover:scale-105 active:scale-[0.99]">
              Iniciar sesión
            </button>
          </div>

          <div class="flex mt-7 items-center text-center">
            <hr class="border-gray-300 border-1 w-full rounded-md" />
            <label class="block font-medium text-sm text-gray-600 w-full">
              O continúa con
            </label>
            <hr class="border-gray-300 border-1 w-full rounded-md" />
          </div>

          <div class="flex mt-7 justify-center gap-4">
            <button type="button" class="bg-white border border-gray-200 px-6 py-2
              rounded-xl shadow-md
             hover:bg-gray-50 transition duration-500 ease-in-out
             transform hover:scale-105 active:scale-[0.99]">
              <iconify-icon icon="flat-color-icons:google" width="24" height="24"></iconify-icon>
            </button>

            <button type="button" class="bg-black px-6 py-2 rounded-xl text-white
              shadow-md
             hover:bg-gray-900 transition duration-500 ease-in-out
             transform hover:scale-105 active:scale-[0.99]">
              <iconify-icon icon="ic:baseline-apple" width="24" height="24" class="text-white"></iconify-icon>
            </button>
          </div>

          <div class="mt-7">
            <div class="flex justify-center items-center">
              <label class="mr-2">¿No tienes cuenta?</label>

              <!-- antes btn btn-outline -->
              <a routerLink="/auth/register" class="inline-flex items-center justify-center px-4 py-2 rounded-xl
                       border border-blue-200 text-blue-600 font-semibold
                       hover:bg-blue-50 transition duration-500 ease-in-out
                       transform hover:scale-105 active:scale-[0.99]">
                Regístrate
              </a>
            </div>
          </div>

        </form>
      </div>
    </div>
  </div>
</div>
