<div class="absolute inset-0 z-50 flex flex-col items-center justify-center"
     [class]="darkBackground ? 'bg-black/30' : 'bg-white/80 backdrop-blur-sm rounded-3xl'">
  <img [src]="logo" alt="logo" class="w-20 h-20 animate-bounce mb-4" />
  <p class="font-semibold text-lg tracking-wide"
     [class]="darkBackground ? 'text-white' : 'text-blue-600'">
    {{ message }}
  </p>
</div>
