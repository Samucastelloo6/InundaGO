<nav
  class="fixed top-0 left-0 right-0 z-[1000] pointer-events-auto
         w-full h-16 px-3 sm:px-4
         flex items-center justify-between gap-3
         backdrop-blur-xl shadow-lg
         bg-white/80 text-slate-900 border-b border-black/10
         dark:bg-slate-950/70 dark:text-white dark:border-white/10"
>


  <div class="flex items-center gap-2">
    <div class="relative">

      <!-- Botón menú -->
      <button
        type="button"
        (click)="menuOpen = !menuOpen"
        class="h-10 w-10 rounded-xl grid place-items-center
               text-slate-700 hover:text-slate-900 hover:bg-black/5
               dark:text-white/90 dark:hover:text-white dark:hover:bg-white/10
               transition focus:outline-none focus:ring-2 focus:ring-black/10 dark:focus:ring-white/20"
        aria-label="Abrir menú"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none"
             viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M4 6h16M4 12h16M4 18h7" />
        </svg>
      </button>

      <!-- Dropdown -->
      <div
        *ngIf="menuOpen"
        class="absolute left-0 mt-3 w-56 z-50
               rounded-2xl backdrop-blur-xl shadow-xl p-2
               bg-white/90 border border-black/10
               dark:bg-slate-950/90 dark:border-white/10"
      >
        <ul class="space-y-1">
          <li *ngFor="let route of routes">
            <a
              [routerLink]="route.path"
              (click)="menuOpen = false"
              class="flex items-center gap-2 px-3 py-2 rounded-xl text-sm
             text-slate-700 hover:text-slate-900 hover:bg-black/5
             dark:text-white/85 dark:hover:text-white dark:hover:bg-white/10
             transition"
            >
            <iconify-icon [icon]="routeIcons[route.path] || ''" width="18"
  height="18"></iconify-icon>
              {{ route.title }}
            </a>
          </li>
        </ul>

        <div class="border-t border-black/10 dark:border-white/10 mt-2 pt-2 sm:hidden">
          <button
            (click)="logout()"
            class="block w-full text-left px-3 py-2 rounded-xl text-sm
                   text-red-500 hover:bg-black/5
                   dark:hover:bg-white/10 transition"
          >
          <iconify-icon icon="iconamoon:exit-bold" width="18"
  height="18"></iconify-icon>
            Cerrar sesión
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="flex-1 flex justify-center">
    <div class="flex items-center gap-3 select-none">

      <!-- Logo -->

      <img src="/logo_inunda_go.png" class="w-16 h-16"  alt="logo" />

      <!-- Marca -->
      <div class="leading-tight">
        <div class="flex items-baseline gap-2">
          <span class="text-base sm:text-lg font-semibold tracking-tight">
            InundaGO
          </span>

          <span class="hidden sm:inline text-xs text-slate-500 dark:text-slate-400">
            Planificador de rutas seguras
          </span>
        </div>


      </div>

    </div>
  </div>



  <div class="flex items-center gap-2">

      <a routerLink="/profile"
     class="flex items-center gap-2 px-2 py-2 sm:px-3 rounded-xl
            bg-black/5 border border-black/10
            dark:bg-white/5 dark:border-white/10
            hover:bg-black/10 dark:hover:bg-white/10 transition
  cursor-pointer">

    <iconify-icon icon="mynaui:user-circle" width="22" height="22"
  class="opacity-80"></iconify-icon>

    <span class="hidden sm:inline text-sm font-medium truncate
  max-w-[140px]">
      {{ userName }}
    </span>

  </a>


    <!-- Toggle Dark / Light -->
    <button
      type="button"
      (click)="toggleTheme()"
      class="h-10 w-10 rounded-xl grid place-items-center
             hover:bg-black/5 dark:hover:bg-white/10
             transition focus:outline-none focus:ring-2 focus:ring-black/10 dark:focus:ring-white/20"
      [attr.title]="isDarkMode ? 'Modo claro' : 'Modo oscuro'"
    >
      <!-- Sol -->
      <svg *ngIf="isDarkMode" xmlns="http://www.w3.org/2000/svg"
           class="h-5 w-5 text-yellow-400"
           fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <circle cx="12" cy="12" r="4" stroke-width="2"></circle>
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41
                 M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
      </svg>

      <!-- Luna -->
      <svg *ngIf="!isDarkMode" xmlns="http://www.w3.org/2000/svg"
           class="h-5 w-5 text-slate-700 dark:text-white"
           fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" />
      </svg>
    </button>

    <!-- Logout -->
    <button
    type="button"
    (click)="logout()"
    class="hidden sm:grid ml-1 h-10 w-10 rounded-xl place-items-center
           text-red-500 hover:bg-black/5 border border-black/10
           dark:hover:bg-white/10 dark:border-white/10
           transition"
    title="Cerrar sesión"
  >
    <iconify-icon icon="iconamoon:exit-bold" width="22"
  height="22"></iconify-icon>
  </button>

  </div>

</nav>
