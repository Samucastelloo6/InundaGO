@if (routeMessage()) {
    <div class="rounded-2xl border p-4 shadow-sm ring-1 ring-black/5"
         [ngClass]="routeHasRisk() ? 'bg-red-50 border-red-200' :
  'bg-emerald-50 border-emerald-200'">
      <div class="text-sm font-semibold"
           [class.text-red-700]="routeHasRisk()"
           [class.text-emerald-700]="!routeHasRisk()">
        {{ routeMessage() }}
      </div>
    </div>
  }

@if (rutaAlternativa() && !showingAlternative()) {
  <button
    type="button"
    class="mt-3 w-full rounded-xl border border-gray-200 bg-white px-4 py-2.5
           text-sm font-semibold text-gray-900 shadow-sm
           hover:bg-gray-50 active:scale-[0.99] transition"
    (click)="showAlternativeRoute.emit()"
  >
    Ver ruta segura
  </button>
}

@if (showingAlternative()) {
  <button
    type="button"
    class="mt-3 w-full rounded-xl border border-gray-200 bg-white px-4 py-2.5
           text-sm font-semibold text-gray-900 shadow-sm
           hover:bg-gray-50 active:scale-[0.99] transition"
    (click)="showMainRoute.emit()"
  >
    Volver a ruta principal
  </button>
}
