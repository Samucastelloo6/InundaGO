<div>
  <div *ngIf="loading" class="text-sm text-gray-600">Cargando rutas...</div>

  <div *ngIf="error" class="text-sm text-red-600">{{ error }}</div>

  <div *ngIf="!loading && !error" class="space-y-3">
    <div *ngFor="let r of routes" class="rounded-xl border border-black/10 bg-white/90 p-3">
      <div class="flex items-center justify-between">
        <div class="text-xs text-gray-500">{{ r.fechaBusqueda | date:'dd/MM/yyyy HH:mm' }}</div>
        <span class="text-xs px-2 py-1 rounded-full" [class.bg-rose-100]="r.riesgo" [class.text-rose-700]="r.riesgo"
          [class.bg-emerald-100]="!r.riesgo" [class.text-emerald-700]="!r.riesgo">
          {{ r.riesgo ? 'Con riesgo' : 'Sin riesgo' }}
        </span>
      </div>

      <div class="mt-2 text-sm text-gray-800">
        {{ r.distancia.toFixed(2) }} km · {{ formatDuration(r.duracion) }}
      </div>

      <div class="mt-1 text-xs text-gray-600 line-clamp-2">
        {{ r.direccionOrigen }} → {{ r.direccionDestino }}
      </div>

      <button class="mt-3 w-full rounded-lg bg-slate-900 text-white py-2 text-sm hover:bg-slate-800 transition"
        (click)="onSelect(r)">
        Ver en el mapa
      </button>
    </div>
  </div>
</div>
