<div class="rounded-2xl border border-white/60
            bg-gradient-to-b from-white/95 to-white/85
            p-4 shadow-sm ring-1 ring-black/5 space-y-3">
  <div class="flex items-center justify-between">
    <div class="text-sm font-semibold text-gray-900">Destino</div>

    @if (pickingActive) {
      <span class="text-xs font-semibold text-gray-700 bg-gray-100 border border-gray-200 px-2 py-1 rounded-lg">
        Selecciona en el mapa
      </span>
    }
  </div>

  <input
    type="text"
    placeholder="Escribe un destino (ej. Meliana)"
    [value]="destinationText()"
    (input)="onDestinationInput(($any($event.target)).value)"
    class="w-full rounded-xl border border-gray-200 bg-white px-4 py-3 text-sm text-gray-900
           placeholder:text-gray-400 shadow-sm
           focus:outline-none focus:ring-2 focus:ring-black/10 transition"
  />

  @if (destinationSuggestions().length) {
    <ul class="rounded-xl border border-gray-200 bg-white shadow-lg overflow-hidden">
      @for (s of destinationSuggestions(); track s.title + s.subtitle) {
        <li class="border-b border-gray-100 last:border-none">
          <button
            type="button"
            class="w-full text-left px-4 py-3 hover:bg-gray-50 transition"
            (click)="selectDestinationSuggestion(s)"
          >
            <div class="text-sm font-semibold text-gray-900 truncate">{{ s.title }}</div>
            <div class="text-xs text-gray-600 truncate">{{ s.subtitle }}</div>
          </button>
        </li>
      }
    </ul>
  }

  <button
      type="button"
      class="relative w-full rounded-xl border px-3 py-2 text-sm font-semibold
             shadow-sm active:scale-[0.99] transition flex items-center justify-center"
      [ngClass]="pickingActive ? 'bg-gray-100 border-gray-300 text-gray-900' : 'bg-white border-gray-200 text-gray-900 hover:bg-gray-50'"
      (click)="togglePick.emit()"
    >
      Elegir destino en mapa
      <iconify-icon icon="mynaui:map-pinned" width="18" height="18" class="absolute right-3"></iconify-icon>
    </button>
</div>
