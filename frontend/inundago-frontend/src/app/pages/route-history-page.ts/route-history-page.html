<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@300;400;600;700&display=swap"
  rel="stylesheet">

  <div style="font-family: 'Noto Sans Arabic', sans-serif;">
      <div class="relative min-h-[calc(100vh-64px)] flex justify-center
  items-start">
          <div class="absolute inset-0 bg-cover bg-center blur-sm
  opacity-50"
               style="background-image: url('/map-bg.png');">
          </div>
          <div class="absolute inset-0 bg-white/30"></div>

          <div class="relative sm:max-w-lg w-full z-10 px-4 py-10">

              <!-- HEADER -->
              <div class="relative mb-6 h-14 flex items-center
  justify-center">
                  <div class="absolute left-0">
                      <img src="/logo_inunda_go.png" class="w-16 h-16"
  alt="logo" />
                  </div>
                  <label class="block text-lg text-gray-700 font-semibold
  text-center">
                      Historial de rutas
                  </label>
              </div>

              <!-- LOADING -->
              <div *ngIf="loading" class="flex items-center justify-center gap-3 text-white mt-10">
                  <span class="h-5 w-5 rounded-full border-2 border-white/40 border-t-white animate-spin"></span>
                  <span>Cargando rutas...</span>
              </div>

              <!-- ERROR -->
              <div *ngIf="error"
                   class="mt-4 rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-red-800">
                  {{ error }}
              </div>

              <!-- SIN RUTAS -->
              <div *ngIf="!loading && !error && routes.length === 0"
                   class="rounded-3xl bg-white/90 shadow-xl backdrop-blur-md px-6 py-10 text-center">
                  <p class="text-gray-500">No tienes rutas guardadas todavía.</p>
              </div>

              <!-- LISTA DE RUTAS -->
              <div *ngIf="!loading && routes.length > 0" class="space-y-4">
                  <div *ngFor="let r of routes"
                       class="rounded-3xl bg-white/90 shadow-xl backdrop-blur-md px-6 py-5">

                      <div class="flex items-center justify-between mb-3">
                          <span class="text-sm text-gray-500">{{ r.fechaBusqueda | date:'dd/MM/yyyy HH:mm' }}</span>
                          <span
                              class="px-3 py-1 rounded-full text-xs font-semibold"
                              [class]="r.riesgo
                                  ? 'bg-red-100 text-red-700'
                                  : 'bg-emerald-100 text-emerald-700'">
                              {{ r.riesgo ? 'Con riesgo' : 'Sin riesgo' }}
                          </span>
                      </div>

                      <div>
                          <label class="block text-sm text-gray-500">Origen</label>
                          <p class="mt-1 w-full bg-gray-100 h-11 rounded-xl shadow-lg
                                    px-4 flex items-center text-gray-900 font-medium">
                              {{ r.direccionOrigen }}
                          </p>
                      </div>

                      <div class="mt-4">
                          <label class="block text-sm text-gray-500">Destino</label>
                          <p class="mt-1 w-full bg-gray-100 h-11 rounded-xl shadow-lg
                                    px-4 flex items-center text-gray-900 font-medium">
                              {{ r.direccionDestino }}
                          </p>
                      </div>

                      <div class="mt-4 flex gap-4">
                          <div class="flex-1">
                              <label class="block text-sm text-gray-500">Distancia</label>
                              <p class="mt-1 w-full bg-gray-100 h-11 rounded-xl shadow-lg
                                        px-4 flex items-center text-gray-700 font-medium">
                                  {{ r.distancia.toFixed(2) }} km
                              </p>
                          </div>
                          <div class="flex-1">
                              <label class="block text-sm text-gray-500">Duración</label>
                              <p class="mt-1 w-full bg-gray-100 h-11 rounded-xl shadow-lg
                                        px-4 flex items-center text-gray-700 font-medium">
                                  {{ formatDuration(r.duracion) }}
                              </p>
                          </div>
                      </div>

                  </div>
              </div>

          </div>
      </div>
  </div>
